[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qodex"
version = "0.1.0"
description = "$0 Open-Source AI Code Reviewer & Secret Leak Gatekeeper"
readme = "README.md"
authors = [{ name = "Ayyappa Pravin", email = "apravint@users.noreply.github.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security"
]
requires-python = ">=3.8"

[project.scripts]
qodex = "qodex.cli:main"

[project.urls]
Homepage = "https://github.com/apravint/qodex"
Issues = "https://github.com/apravint/qodex/issues"
